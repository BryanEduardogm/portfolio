<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wireframe 3 — Case studies em abas</title>
<style>
  :root{ --bg:#111214; --panel:#1b1c1f; --line:#C9A227; --text:#e8e8ea; --muted:#8a8a90; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;padding:32px}
  .tag{position:fixed;top:12px;left:12px;background:#C9A227;color:#111;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600;z-index:10}
  .wrap{max-width:1050px;margin:40px auto 0}
  .box{border:2px dashed var(--line);border-radius:10px;padding:16px;position:relative;margin-bottom:24px}
  .lbl{position:absolute;top:-11px;left:12px;background:var(--bg);padding:0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--line);font-weight:700}
  .topbar{display:flex;justify-content:space-between;align-items:center}
  .logo{width:120px;height:24px;background:var(--panel);border-radius:4px}
  .navitem{width:70px;height:18px;background:var(--panel);border-radius:4px;display:inline-block;margin-left:10px}
  .hero{text-align:center;padding:40px 20px}
  .htitle{width:55%;height:36px;background:var(--panel);margin:0 auto 12px;border-radius:6px}
  .hsub{width:38%;height:14px;background:var(--panel);margin:0 auto 20px;border-radius:4px}
  .hbtns{display:flex;gap:10px;justify-content:center}
  .hbtn{width:110px;height:30px;background:var(--panel);border-radius:8px}
  h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tabitem{width:150px;height:30px;background:var(--panel);border-radius:8px 8px 0 0}
  .tabitem.active{background:var(--line);opacity:.85}
  .stage{display:flex;gap:24px}
  .visual{width:55%;background:var(--panel);border-radius:10px;min-height:280px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .details{width:45%}
  .dtitle{width:75%;height:24px;background:var(--panel);border-radius:6px;margin-bottom:10px}
  .dline{width:100%;height:11px;background:var(--panel);border-radius:3px;margin-bottom:7px}
  .dline.sm{width:60%}
  .dtags{display:flex;gap:6px;margin:14px 0}
  .dtag{width:40px;height:14px;background:var(--panel);border-radius:4px}
  .dlist{margin:14px 0}
  .ditem{width:90%;height:10px;background:var(--panel);border-radius:3px;margin-bottom:8px}
  .cta{display:flex;gap:10px;margin-top:16px}
  .btn{width:80px;height:26px;background:var(--panel);border-radius:6px}
  .thumbrow{display:flex;gap:12px;margin-top:20px}
  .thumb{flex:1;height:60px;background:var(--panel);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
  .footer{text-align:center;padding:16px}
  .fline{width:50%;height:12px;background:var(--panel);margin:0 auto 8px;border-radius:4px}
</style>
</head>
<body>
  <span class="tag">Wireframe 3 · Case studies em abas</span>
  <div class="wrap">

    <div class="box">
      <span class="lbl">Cabeçalho</span>
      <div class="topbar">
        <div class="logo"></div>
        <div>
          <div class="navitem"></div><div class="navitem"></div>
        </div>
      </div>
      <div class="hero">
        <div class="htitle"></div>
        <div class="hsub"></div>
        <div class="hbtns"><div class="hbtn"></div><div class="hbtn"></div></div>
      </div>
    </div>

    <div class="box">
      <span class="lbl">Case study em destaque (um projeto por vez)</span>
      <h2>Selecione o projeto</h2>
      <div class="tabs">
        <div class="tabitem active"></div>
        <div class="tabitem"></div>
        <div class="tabitem"></div>
        <div class="tabitem"></div>
        <div class="tabitem"></div>
      </div>
      <div class="stage">
        <div class="visual">preview grande do site selecionado</div>
        <div class="details">
          <div class="dtitle"></div>
          <div class="dtags"><div class="dtag"></div><div class="dtag"></div><div class="dtag"></div></div>
          <div class="dline"></div>
          <div class="dline"></div>
          <div class="dline sm"></div>
          <div class="dlist">
            <div class="ditem"></div>
            <div class="ditem"></div>
            <div class="ditem"></div>
            <div class="ditem" style="width:70%"></div>
          </div>
          <div class="cta"><div class="btn"></div><div class="btn"></div></div>
        </div>
      </div>
      <div class="thumbrow">
        <div class="thumb">01</div>
        <div class="thumb">02</div>
        <div class="thumb">03</div>
        <div class="thumb">04</div>
        <div class="thumb">05</div>
      </div>
    </div>

    <div class="box footer">
      <span class="lbl">Rodapé</span>
      <div class="fline"></div>
      <div class="fline" style="width:30%"></div>
    </div>

  </div>
</body>
</html>
