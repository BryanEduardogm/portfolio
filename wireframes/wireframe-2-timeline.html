<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wireframe 2 — Timeline alternada</title>
<style>
  :root{ --bg:#111214; --panel:#1b1c1f; --line:#C1602B; --text:#e8e8ea; --muted:#8a8a90; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;padding:32px}
  .tag{position:fixed;top:12px;left:12px;background:#C1602B;color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600;z-index:10}
  .wrap{max-width:1000px;margin:40px auto 0;display:flex;gap:24px}
  .sidebar{width:200px;flex-shrink:0;position:sticky;top:32px;align-self:flex-start}
  .box{border:2px dashed var(--line);border-radius:10px;padding:16px;position:relative}
  .lbl{position:absolute;top:-11px;left:12px;background:var(--bg);padding:0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--line);font-weight:700}
  .navitem{width:100%;height:16px;background:var(--panel);border-radius:4px;margin-bottom:12px}
  .navitem:last-child{margin-bottom:0}
  .main{flex:1}
  .hero{margin-bottom:20px;padding:24px}
  .htitle{width:70%;height:30px;background:var(--panel);margin-bottom:10px;border-radius:6px}
  .hsub{width:50%;height:12px;background:var(--panel);border-radius:4px}
  .timeline{position:relative;padding-left:0;margin-top:10px}
  .titem{display:flex;gap:20px;align-items:stretch;margin-bottom:26px;position:relative}
  .titem.rev{flex-direction:row-reverse}
  .visual{width:45%;background:var(--panel);border-radius:8px;min-height:130px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .info{width:55%;padding:6px 10px}
  .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--line)}
  .num{width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-bottom:10px}
  .iline{width:80%;height:14px;background:var(--panel);border-radius:4px;margin-bottom:8px}
  .isub{width:60%;height:10px;background:var(--panel);border-radius:3px;margin-bottom:14px}
  .ctag{display:inline-block;width:34px;height:10px;background:var(--panel);border-radius:3px;margin-right:6px}
  .cta{display:flex;gap:8px;margin-top:12px}
  .btn{width:70px;height:22px;background:var(--panel);border-radius:6px}
  .footer{margin-top:24px;padding:20px;text-align:center}
  .fline{width:50%;height:12px;background:var(--panel);margin:0 auto 8px;border-radius:4px}
  h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:30px 0 10px}
</style>
</head>
<body>
  <span class="tag">Wireframe 2 · Timeline alternada</span>
  <div class="wrap">

    <div class="sidebar box">
      <span class="lbl">Nav lateral fixa</span>
      <div class="navitem"></div>
      <div class="navitem"></div>
      <div class="navitem"></div>
      <div class="navitem"></div>
    </div>

    <div class="main">
      <div class="box hero">
        <span class="lbl">Hero / apresentação</span>
        <div class="htitle"></div>
        <div class="hsub"></div>
      </div>

      <h2>Projetos — blocos alternados esquerda/direita</h2>
      <div class="box">
        <span class="lbl">Linha do tempo de projetos</span>
        <div class="timeline">

          <div class="titem">
            <div class="visual">imagem grande 1</div>
            <div class="info">
              <div class="num">01</div>
              <div class="iline"></div>
              <div class="isub"></div>
              <span class="ctag"></span><span class="ctag"></span><span class="ctag"></span>
              <div class="cta"><div class="btn"></div><div class="btn"></div></div>
            </div>
          </div>

          <div class="titem rev">
            <div class="visual">imagem grande 2</div>
            <div class="info">
              <div class="num">02</div>
              <div class="iline"></div>
              <div class="isub"></div>
              <span class="ctag"></span><span class="ctag"></span><span class="ctag"></span>
              <div class="cta"><div class="btn"></div><div class="btn"></div></div>
            </div>
          </div>

          <div class="titem">
            <div class="visual">imagem grande 3</div>
            <div class="info">
              <div class="num">03</div>
              <div class="iline"></div>
              <div class="isub"></div>
              <span class="ctag"></span><span class="ctag"></span><span class="ctag"></span>
              <div class="cta"><div class="btn"></div><div class="btn"></div></div>
            </div>
          </div>

          <div class="titem rev">
            <div class="visual">imagem grande 4</div>
            <div class="info">
              <div class="num">04</div>
              <div class="iline"></div>
              <div class="isub"></div>
              <span class="ctag"></span><span class="ctag"></span><span class="ctag"></span>
              <div class="cta"><div class="btn"></div><div class="btn"></div></div>
            </div>
          </div>

          <div class="titem">
            <div class="visual">imagem grande 5</div>
            <div class="info">
              <div class="num">05</div>
              <div class="iline"></div>
              <div class="isub"></div>
              <span class="ctag"></span><span class="ctag"></span><span class="ctag"></span>
              <div class="cta"><div class="btn"></div><div class="btn"></div></div>
            </div>
          </div>

        </div>
      </div>

      <div class="box footer">
        <span class="lbl">Rodapé</span>
        <div class="fline"></div>
        <div class="fline" style="width:30%"></div>
      </div>
    </div>

  </div>
</body>
</html>
